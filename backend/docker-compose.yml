name: arhibot

services:
  api:
    labels:
      com.auroom.release: "${AUROOM_RELEASE_SHA:-unknown}"
    build: .
    ports:
      - "127.0.0.1:18000:8000"
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  bot:
    labels:
      com.auroom.release: "${AUROOM_RELEASE_SHA:-unknown}"
    build: .
    command: ["python", "-m", "app.telegram_bot.main"]
    env_file:
      - .env
    depends_on:
      - api
    restart: unless-stopped

  worker:
    labels:
      com.auroom.release: "${AUROOM_RELEASE_SHA:-unknown}"
    build: .
    command: ["python", "-m", "app.workers.generation_worker"]
    env_file:
      - .env
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.heartbeat", "check", "generation", "45"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  renderer-worker:
    profiles: ["3d"]
    labels:
      com.auroom.release: "${AUROOM_RELEASE_SHA:-unknown}"
    build:
      context: .
      dockerfile: Dockerfile.renderer
    env_file:
      - .env
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  broadcast-worker:
    labels:
      com.auroom.release: "${AUROOM_RELEASE_SHA:-unknown}"
    build: .
    command: ["python", "-m", "app.workers.broadcast_worker"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.heartbeat", "check", "broadcast", "45"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  maintenance:
    labels:
      com.auroom.release: "${AUROOM_RELEASE_SHA:-unknown}"
    build: .
    command: ["python", "-m", "app.workers.maintenance_worker"]
    env_file:
      - .env
    volumes:
      - media_data:/data/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.workers.heartbeat", "check", "maintenance", "45"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    labels:
      com.auroom.release: "${AUROOM_RELEASE_SHA:-unknown}"
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_APP_NAME: ${FRONTEND_APP_NAME:-AuRoom}
    expose:
      - "80"
    restart: unless-stopped

  nginx:
    labels:
      com.auroom.release: "${AUROOM_RELEASE_SHA:-unknown}"
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:18080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - frontend
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  media_data:
