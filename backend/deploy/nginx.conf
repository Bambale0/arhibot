events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream api_upstream {
        zone api_upstream 64k;
        server api:8000 resolve;
    }

    upstream frontend_upstream {
        zone frontend_upstream 64k;
        server frontend:80 resolve;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 21m;
        server_tokens off;

        location ~ /\. {
            deny all;
        }

        location = /metrics {
            access_log off;
            return 404;
        }

        location /uploads/ {
            return 404;
            access_log off;
            add_header Cache-Control "no-store" always;
        }

        location /api/v1/media/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Host nginx is the public trust boundary and overwrites these headers.
            # This container only listens on 127.0.0.1:18080, so preserve the sanitized client IP.
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
            access_log off;
        }

        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Host nginx is the public trust boundary and overwrites these headers.
            # This container only listens on 127.0.0.1:18080, so preserve the sanitized client IP.
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
        }

        location ~ ^/(health/|openapi\.json$|docs(?:/|$)|redoc(?:/|$)) {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Host nginx is the public trust boundary and overwrites these headers.
            # This container only listens on 127.0.0.1:18080, so preserve the sanitized client IP.
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # Host nginx is the public trust boundary and overwrites these headers.
            # This container only listens on 127.0.0.1:18080, so preserve the sanitized client IP.
            proxy_set_header X-Real-IP $http_x_real_ip;
            proxy_set_header X-Forwarded-For $http_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
