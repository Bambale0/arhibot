apiVersion: 1

datasources:
  - name: AuRoom Prometheus
    uid: auroom-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST

  - name: AuRoom Jaeger
    uid: auroom-jaeger
    type: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
