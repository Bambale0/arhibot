[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "ai-architecture-backend"
dynamic = ["version"]
description = "Backend platform for AuRoom"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1,<1.0",
  "uvicorn[standard]>=0.52.4,<1.0",
  "pydantic>=2.13.5,<3.0",
  "pydantic-settings>=2.15,<3.0",
  "sqlalchemy[asyncio]>=2.0.52,<3.0",
  "asyncpg>=0.31,<1.0",
  "alembic>=1.19.1,<2.0",
  "redis[hiredis]>=8.1,<9.0",
  "httpx>=0.28,<1.0",
  "PyJWT>=2.10,<3.0",
  "argon2-cffi>=25.1,<26.0",
  "email-validator>=2.2,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "Pillow>=11.3,<13.0",
  "shapely>=2.1,<3.0",
  "prometheus-client>=0.22,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10.0",
  "pytest-asyncio>=1.0,<2.0",
  "ruff>=0.12,<1.0",
  "mypy>=1.16,<2.0",
  "pip-audit==2.10.1",
  "pip-tools==7.6.1",
]

[tool.hatch.version]
path = "app/version.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires PostgreSQL/Redis and migrated test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
