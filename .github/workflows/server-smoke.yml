name: Server smoke

on:
  workflow_run:
    workflows: [Deploy dev]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arhibot-server-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Test deployed dev on server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    env:
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_APP_DIR: /root/arhibot
    steps:
      - name: Require server access
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=()
          for name in DEPLOY_SSH_HOST DEPLOY_SSH_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Server smoke is mandatory. Missing repository secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo "DEPLOY_SSH_PORT=${DEPLOY_SSH_PORT:-22}" >> "${GITHUB_ENV}"

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Run smoke checks on development host
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          ssh -p "${DEPLOY_SSH_PORT}" "${remote}" bash -s -- "${DEPLOY_APP_DIR}" <<'REMOTE'
          set -Eeuo pipefail
          app_dir=$1
          cd "${app_dir}/backend"
          expected_sha=$(awk -F= '$1 == "RELEASE_SHA" {print $2}' "${app_dir}/.release/current.env" 2>/dev/null || true)
          [[ -n "${expected_sha}" ]] || { echo "Missing deployed release manifest" >&2; exit 1; }

          if docker compose version >/dev/null 2>&1; then
            compose=(docker compose)
          elif command -v docker-compose >/dev/null 2>&1; then
            compose=(docker-compose)
          else
            echo "Docker Compose is not installed" >&2
            exit 1
          fi

          dump_api_failure() {
            echo "Recent API logs:" >&2
            "${compose[@]}" logs --tail 150 api 2>&1 >&2 || true
          }

          "${compose[@]}" ps

          curl -fsS http://127.0.0.1:18080/health/live >/dev/null
          curl -fsS http://127.0.0.1:18080/health/ready >/dev/null
          version_sha=$(curl -fsS http://127.0.0.1:18080/health/version | python3 -c 'import json,sys; print(json.load(sys.stdin).get("release_sha", ""))')
          [[ "${version_sha}" == "${expected_sha}" ]] || { echo "HTTP release mismatch: ${version_sha:-missing} != ${expected_sha}" >&2; exit 1; }
          [[ "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/metrics)" == "404" ]] || { echo "Container edge exposed /metrics" >&2; exit 1; }
          for path in openapi.json docs redoc; do
            [[ "$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:18000/${path}")" == "404" ]] || { echo "Production API exposed /${path}" >&2; exit 1; }
          done
          curl -fsS http://127.0.0.1:18000/metrics | grep '^auroom_build_info' >/dev/null || { echo "Internal metrics missing build info" >&2; exit 1; }

          curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:19090/-/ready >/dev/null || { echo "Prometheus is not ready" >&2; exit 1; }
          curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:13000/api/health >/dev/null || { echo "Grafana is not healthy" >&2; exit 1; }
          curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:13133/status >/dev/null || { echo "Jaeger is not healthy" >&2; exit 1; }

          prometheus_api_up=$(curl -fsSG --connect-timeout 2 --max-time 5 \
            --data-urlencode 'query=up{job="auroom-api"}' \
            http://127.0.0.1:19090/api/v1/query \
            | python3 -c 'import json,sys; p=json.load(sys.stdin); rows=p.get("data",{}).get("result",[]); print(1 if rows and rows[0].get("value",["","0"])[1] == "1" else 0)')
          [[ "${prometheus_api_up}" == "1" ]] || { echo "Prometheus is not scraping the API" >&2; exit 1; }

          # Force one sampled parent so this check is deterministic even when the
          # production root sampler is below 100%.
          trace_id=11111111111111111111111111111111
          curl -fsS \
            -H "traceparent: 00-${trace_id}-2222222222222222-01" \
            http://127.0.0.1:18000/health/version >/dev/null
          jaeger_trace_seen=0
          for attempt in $(seq 1 20); do
            if curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:16686/api/services \
              | python3 -c 'import json,sys; p=json.load(sys.stdin); raise SystemExit(0 if "auroom-api" in (p.get("data") or []) else 1)'; then
              jaeger_trace_seen=1
              break
            fi
            sleep 1
          done
          (( jaeger_trace_seen == 1 )) || { echo "Jaeger did not ingest an AuRoom API trace" >&2; exit 1; }

          for binding in 'prometheus:9090:127.0.0.1:19090' 'grafana:3000:127.0.0.1:13000' 'jaeger:16686:127.0.0.1:16686' 'jaeger:13133:127.0.0.1:13133'; do
            service=${binding%%:*}
            remainder=${binding#*:}
            port=${remainder%%:*}
            expected=${remainder#*:}
            actual=$("${compose[@]}" port "${service}" "${port}" 2>/dev/null | head -n1)
            [[ "${actual}" == "${expected}" ]] || { echo "Unsafe observability bind for ${service}:${port}: ${actual:-missing}" >&2; exit 1; }
          done

          curl -fsS http://127.0.0.1:18080/ | grep -q '<div id="root"></div>'

          # Prove the trusted host-proxy client IP survives the inner Nginx hop.
          # The auth limiter hashes request_identity(), so one synthetic request
          # must increment exactly the bucket for the supplied X-Real-IP value.
          seconds=$(date +%S)
          if (( 10#${seconds} >= 55 )); then sleep 6; fi
          probe_ip="198.51.100.77"
          probe_digest=$(printf '%s' "${probe_ip}" | sha256sum | cut -c1-24)
          probe_bucket=$(python3 -c 'import time; print(int(time.time() // 60))')
          probe_key="auroom:rate:auth:${probe_digest}:${probe_bucket}"
          before_raw=$("${compose[@]}" exec -T redis sh -lc 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --raw GET "$1"' sh "${probe_key}" 2>/dev/null || true)
          before=${before_raw:-0}
          [[ "${before}" =~ ^[0-9]+$ ]] || before=0
          probe_status=$(curl -sS -o /dev/null -w '%{http_code}'             -H "X-Real-IP: ${probe_ip}"             -H 'Content-Type: application/json'             --data '{"email":"proxy-probe@example.invalid","password":"not-a-real-password"}'             http://127.0.0.1:18080/api/v1/auth/login)
          [[ "${probe_status}" == "401" || "${probe_status}" == "429" ]] || {
            echo "Unexpected auth probe status: ${probe_status}" >&2
            exit 1
          }
          after_raw=$("${compose[@]}" exec -T redis sh -lc 'REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli --raw GET "$1"' sh "${probe_key}" 2>/dev/null || true)
          after=${after_raw:-0}
          [[ "${after}" =~ ^[0-9]+$ ]] || {
            echo "Client-IP rate bucket was not created for ${probe_ip}" >&2
            exit 1
          }
          (( after == before + 1 )) || {
            echo "Trusted client IP was not preserved through inner Nginx: before=${before} after=${after}" >&2
            exit 1
          }

          raw_media_status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/uploads/auroom-private-media-probe)
          [[ "${raw_media_status}" == "404" ]] || {
            echo "Raw /uploads access must be disabled, got HTTP ${raw_media_status}" >&2
            exit 1
          }

          "${compose[@]}" exec -T api python - <<'PY'
          from app.core.config import get_settings

          settings = get_settings()
          if not settings.is_production:
              raise SystemExit("Public AuRoom runtime must use APP_ENV=production")
          if not settings.media_signing_secret:
              raise SystemExit("Public AuRoom runtime requires MEDIA_SIGNING_SECRET")
          print("production_runtime=true signed_media=true")
          PY

          public_webapp_url=$("${compose[@]}" exec -T bot python - <<'PY'
          from app.core.config import get_settings
          from app.telegram_bot.main import canonicalize_webapp_url

          url = (get_settings().telegram_webapp_url or "").strip()
          if not url:
              raise SystemExit("TELEGRAM_WEBAPP_URL is empty in the deployed bot container")
          print(canonicalize_webapp_url(url))
          PY
          )

          case "${public_webapp_url}" in
            https://*) ;;
            *)
              echo "Configured Telegram Mini App URL is not HTTPS" >&2
              exit 1
              ;;
          esac

          public_base=${public_webapp_url%/}
          for path in metrics openapi.json docs redoc; do
            [[ "$(curl -sS -o /dev/null -w '%{http_code}' "${public_base}/${path}")" == "404" ]] || { echo "Public /${path} must return 404" >&2; exit 1; }
          done
          public_headers=$(curl -fsSI "${public_base}/")
          grep -qi '^strict-transport-security: max-age=31536000; includeSubDomains' <<<"${public_headers}" || { echo "HSTS header missing" >&2; exit 1; }
          grep -qi '^x-content-type-options: nosniff' <<<"${public_headers}" || { echo "nosniff header missing" >&2; exit 1; }
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' <<<"${public_headers}" || { echo "Referrer-Policy header missing" >&2; exit 1; }
          grep -qi '^content-security-policy:' <<<"${public_headers}" || { echo "Content-Security-Policy header missing" >&2; exit 1; }
          if grep -qiE '^server: .*/[0-9]' <<<"${public_headers}"; then
            echo "Public Server header exposes a version" >&2
            exit 1
          fi

          if ! curl -fsSL --connect-timeout 8 --max-time 20 "${public_webapp_url}" | grep -q '<div id="root"></div>'; then
            echo "Public Telegram Mini App URL is unreachable or does not serve the frontend" >&2
            "${compose[@]}" logs --tail 100 nginx frontend 2>&1 >&2 || true
            exit 1
          fi

          if ! "${compose[@]}" exec -T bot python - <<'PY'
          import sys
          from urllib.parse import urlsplit

          from app.core.config import get_settings
          from app.telegram_bot.main import TelegramBotApi, canonicalize_webapp_url

          settings = get_settings()
          expected = (settings.telegram_webapp_url or "").strip()
          token = (settings.telegram_bot_token or "").strip()
          if not expected or not token:
              raise SystemExit("Telegram Mini App runtime configuration is incomplete")

          menu = TelegramBotApi(token).call("getChatMenuButton") or {}
          actual = ((menu.get("web_app") or {}).get("url") or "").strip()
          if menu.get("type") != "web_app" or not actual:
              raise SystemExit("Telegram default chat menu is not configured as a Web App")

          expected_canonical = canonicalize_webapp_url(expected)
          actual_canonical = canonicalize_webapp_url(actual)
          actual_host = urlsplit(actual).hostname or ""
          if not actual_host.isascii() or actual != actual_canonical:
              print(
                  "Telegram Mini App URL must be stored in Telegram with an ASCII/IDNA hostname: "
                  f"actual_host={actual_host!r}",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          if expected_canonical != actual_canonical:
              expected_host = urlsplit(expected_canonical).hostname
              actual_host = urlsplit(actual_canonical).hostname
              print(
                  f"Telegram Mini App URL mismatch: expected_host={expected_host} actual_host={actual_host}",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print(f"telegram_menu_button_url_match=true host={urlsplit(actual_canonical).hostname}")
          PY
          then
            echo "Telegram chat menu Mini App URL does not match deployed TELEGRAM_WEBAPP_URL" >&2
            "${compose[@]}" logs --tail 100 bot 2>&1 >&2 || true
            exit 1
          fi

          questionnaire_body=$(mktemp)
          if ! curl -fsS http://127.0.0.1:18080/api/v1/questionnaires -o "${questionnaire_body}"; then
            echo "Questionnaire catalog endpoint failed" >&2
            cat "${questionnaire_body}" >&2 || true
            dump_api_failure
            rm -f "${questionnaire_body}"
            exit 1
          fi
          if ! grep -q '"questionnaires"' "${questionnaire_body}"; then
            echo "Questionnaire catalog response is malformed" >&2
            cat "${questionnaire_body}" >&2 || true
            dump_api_failure
            rm -f "${questionnaire_body}"
            exit 1
          fi
          rm -f "${questionnaire_body}"

          if ! "${compose[@]}" exec -T api python -m app.runtime_checks; then
            echo "Runtime contract checks failed (project contexts, Telegram delivery or questionnaire generation readiness)" >&2
            dump_api_failure
            exit 1
          fi

          for service in api bot maintenance worker broadcast-worker frontend nginx postgres redis prometheus grafana jaeger; do
            container_id=$("${compose[@]}" ps -q "${service}")
            [[ -n "${container_id}" ]] || { echo "Missing container: ${service}" >&2; exit 1; }
            running=$(docker inspect -f '{{.State.Running}}' "${container_id}")
            [[ "${running}" == "true" ]] || { echo "Container is not running: ${service}" >&2; exit 1; }
            if [[ "${service}" != "postgres" && "${service}" != "redis" ]]; then
              release_label=$(docker inspect -f '{{ index .Config.Labels "com.auroom.release" }}' "${container_id}")
              [[ "${release_label}" == "${expected_sha}" ]] || {
                echo "Release mismatch for ${service}: ${release_label:-missing} != ${expected_sha}" >&2
                exit 1
              }
            fi
          done

          for service in maintenance worker broadcast-worker frontend postgres redis; do
            container_id=$("${compose[@]}" ps -q "${service}")
            health=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}missing{{end}}' "${container_id}")
            [[ "${health}" == "healthy" ]] || {
              echo "Container health is not healthy for ${service}: ${health}" >&2
              "${compose[@]}" logs --tail 100 "${service}" 2>&1 >&2 || true
              exit 1
            }
          done

          renderer_id=$("${compose[@]}" --profile 3d ps -q renderer-worker || true)
          if [[ -n "${renderer_id}" ]] && [[ "$(docker inspect -f '{{.State.Running}}' "${renderer_id}" 2>/dev/null || true)" == "true" ]]; then
            echo "renderer-worker must be stopped while 3D is disabled" >&2
            exit 1
          fi

          echo "Development API, public Mini App URL, Telegram menu button, questionnaire catalog, frontend, workers and observability stack match release ${expected_sha}; Prometheus scrapes the API, Jaeger ingests traces, and 3D renderer is disabled"
          REMOTE
