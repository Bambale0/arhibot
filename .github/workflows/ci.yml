name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock
            backend/requirements-build.lock

      - name: Install backend
        run: python -m pip install -e '.[dev]'

      - name: Verify Python dependency locks are current
        run: ./scripts/dependency_locks.sh CHECK

      - name: Audit locked Python dependencies
        run: |
          pip-audit -r requirements.lock --require-hashes --progress-spinner off --strict
          pip-audit -r requirements-build.lock --require-hashes --progress-spinner off --strict

      - name: Compile
        run: python -m compileall -q app tests

      - name: Validate operations scripts
        working-directory: .
        run: |
          bash -n ops/deploy_docker.sh ops/backup_runtime.sh ops/restore_runtime.sh ops/runtime_housekeeping.sh ops/install_host_nginx.sh backend/scripts/dependency_locks.sh
          python -m py_compile ops/runtime_preflight.py

      - name: Validate Docker Compose
        working-directory: .
        run: |
          cp backend/.env.example backend/.env
          trap 'rm -f backend/.env' EXIT
          docker compose --project-directory backend -f backend/docker-compose.yml config --quiet
          docker compose --project-directory backend -f backend/docker-compose.yml build api frontend

      - name: Unit and contract tests
        run: pytest -q -m 'not integration'

      - name: Export OpenAPI contract
        run: python scripts/export_openapi.py

  backend-integration:
    name: Backend integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-access-secret-at-least-32-characters-long
      REFRESH_TOKEN_SECRET: ci-refresh-secret-at-least-32-characters-long
      MEDIA_ROOT: /tmp/arhibot-media
      MEDIA_PUBLIC_BASE_URL: http://localhost:8000
      RUN_INTEGRATION_TESTS: '1'
      NEXUS_API_KEY: integration-nexus-key
      YOOKASSA_SHOP_ID: integration-shop
      YOOKASSA_SECRET_KEY: integration-secret
      YOOKASSA_RETURN_URL: https://example.test/return
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock
            backend/requirements-build.lock

      - name: Install backend
        run: python -m pip install -e '.[dev]'

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify migration metadata is at head
        run: alembic check

      - name: Integration tests
        run: pytest -q -m integration

      - name: Controlled Redis pause/recovery probe
        working-directory: .
        run: |
          set -Eeuo pipefail
          docker run -d --name auroom-chaos-redis -p 127.0.0.1::6379 redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576 >/dev/null
          trap 'docker rm -f auroom-chaos-redis >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            docker exec auroom-chaos-redis redis-cli ping >/dev/null 2>&1 && break
            sleep 0.25
          done
          chaos_port=$(docker port auroom-chaos-redis 6379/tcp | sed -E 's/.*:([0-9]+)$/\1/' | head -n1)
          [[ "${chaos_port}" =~ ^[0-9]+$ ]] || { echo "Could not resolve chaos Redis port" >&2; exit 1; }
          export REDIS_URL="redis://127.0.0.1:${chaos_port}/0"
          export REDIS_SOCKET_CONNECT_TIMEOUT_SECONDS=1
          export REDIS_SOCKET_TIMEOUT_SECONDS=1
          python backend/scripts/redis_failure_probe.py expect-up 2
          docker pause auroom-chaos-redis >/dev/null
          python backend/scripts/redis_failure_probe.py expect-down 3
          docker unpause auroom-chaos-redis >/dev/null
          for attempt in $(seq 1 20); do
            if python backend/scripts/redis_failure_probe.py expect-up 2; then
              exit 0
            fi
            sleep 0.25
          done
          echo "Redis did not recover after controlled pause" >&2
          exit 1

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit frontend production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Critical mobile E2E
        run: npm run test:e2e
