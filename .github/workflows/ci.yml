name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e '.[dev]'

      - name: Compile
        run: python -m compileall -q app tests

      - name: Validate operations scripts
        working-directory: .
        run: |
          bash -n ops/deploy_docker.sh ops/backup_runtime.sh ops/restore_runtime.sh ops/runtime_housekeeping.sh ops/install_host_nginx.sh
          python -m py_compile ops/runtime_preflight.py

      - name: Validate Docker Compose
        working-directory: .
        run: |
          cp backend/.env.example backend/.env
          trap 'rm -f backend/.env' EXIT
          docker compose --project-directory backend -f backend/docker-compose.yml config --quiet
          docker compose --project-directory backend -f backend/docker-compose.yml build api frontend

      - name: Unit and contract tests
        run: pytest -q -m 'not integration'

      - name: Export OpenAPI contract
        run: python scripts/export_openapi.py

  backend-integration:
    name: Backend integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-access-secret-at-least-32-characters-long
      REFRESH_TOKEN_SECRET: ci-refresh-secret-at-least-32-characters-long
      MEDIA_ROOT: /tmp/arhibot-media
      MEDIA_PUBLIC_BASE_URL: http://localhost:8000
      RUN_INTEGRATION_TESTS: '1'
      NEXUS_API_KEY: integration-nexus-key
      YOOKASSA_SHOP_ID: integration-shop
      YOOKASSA_SECRET_KEY: integration-secret
      YOOKASSA_RETURN_URL: https://example.test/return
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e '.[dev]'

      - name: Apply migrations
        run: alembic upgrade head

      - name: Verify migration metadata is at head
        run: alembic check

      - name: Integration tests
        run: pytest -q -m integration

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Critical mobile E2E
        run: npm run test:e2e
