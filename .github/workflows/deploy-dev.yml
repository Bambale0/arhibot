name: Deploy dev

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: arhibot-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy latest green dev
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'dev') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/dev')
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_APP_DIR: /root/arhibot
    steps:
      - name: Checkout selected dev revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Require latest green dev commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          checked_out=$(git rev-parse HEAD)
          [[ "${checked_out}" == "${DEPLOY_SHA}" ]] || {
            echo "Checked out ${checked_out}, expected ${DEPLOY_SHA}" >&2
            exit 1
          }

          git fetch --no-tags --depth=1 origin refs/heads/dev
          current_dev=$(git rev-parse FETCH_HEAD)
          [[ "${DEPLOY_SHA}" == "${current_dev}" ]] || {
            echo "Refusing stale dev candidate ${DEPLOY_SHA}; current dev is ${current_dev}." >&2
            exit 1
          }

          successful_runs=$(gh api --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=dev \
            -f head_sha="${DEPLOY_SHA}" \
            -f event=push \
            -f status=success \
            -f per_page=20 \
            --jq '.total_count')

          if [[ "${successful_runs}" -lt 1 ]]; then
            echo "Refusing deploy: CI is not green for dev SHA ${DEPLOY_SHA}." >&2
            exit 1
          fi

      - name: Require server deploy configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          missing=()
          for name in DEPLOY_SSH_HOST DEPLOY_SSH_USER DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Development server deploy configuration is missing: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          echo "DEPLOY_SSH_PORT=${DEPLOY_SSH_PORT:-22}" >> "${GITHUB_ENV}"

      - name: Package immutable candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          git archive --format=tar.gz --output=arhibot-source.tar.gz "${DEPLOY_SHA}"
          sha256sum arhibot-source.tar.gz > arhibot-source.tar.gz.sha256

      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${DEPLOY_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          ssh -p "${DEPLOY_SSH_PORT}" "${remote}" "mkdir -p '${DEPLOY_APP_DIR}/.release'"
          scp -P "${DEPLOY_SSH_PORT}" \
            arhibot-source.tar.gz \
            arhibot-source.tar.gz.sha256 \
            ops/deploy_docker.sh \
            ops/provision_neironych_key.py \
            "${remote}:${DEPLOY_APP_DIR}/.release/"

      # A failed release must not even rotate the runtime API key. The
      # candidate checkout guard runs before secret provisioning and deploy.
      - name: Refuse unsafe dev deploy before changing server secrets
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          ssh -p "${DEPLOY_SSH_PORT}" "${remote}" bash -s -- "${DEPLOY_APP_DIR}" <<'REMOTE'
          set -Eeuo pipefail
          app_dir="$1"
          archive="${app_dir}/.release/arhibot-source.tar.gz"
          [[ -s "${archive}" ]] || { echo "Missing release archive" >&2; exit 1; }

          # Stream exactly the reviewed candidate guard; no host code writes.
          tar -xOzf "${archive}" ops/release_worktree_guard.py | python3 - "${app_dir}"

          # The forced backup script refuses disabled policy only after the
          # API key step; check it here before any production secret mutation.
          policy=$(docker compose --project-directory "${app_dir}/backend" \
            -f "${app_dir}/backend/docker-compose.yml" \
            exec -T postgres psql -U app -d app -Atc \
            "select backup_interval_hours from operational_settings where id=1" | tr -d '[:space:]')
          [[ "${policy}" =~ ^[1-9][0-9]*$ ]] || {
            echo "Refusing deploy before key provisioning: runtime DB/media backups are disabled or policy is unreadable" >&2
            exit 1
          }
          REMOTE

      - name: Configure Neironych dev key
        env:
          NEIRONYCH_API_KEY: ${{ secrets.NEIRONYCH_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${NEIRONYCH_API_KEY}" ]] || {
            echo "NEIRONYCH_API_KEY is not configured in GitHub Secrets; leaving dev unchanged" >&2
            exit 1
          }
          remote="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          printf '%s' "${NEIRONYCH_API_KEY}" | ssh -p "${DEPLOY_SSH_PORT}" "${remote}" \
            python3 "${DEPLOY_APP_DIR}/.release/provision_neironych_key.py" "${DEPLOY_APP_DIR}/backend/.env"

      - name: Build, migrate and deploy development
        shell: bash
        run: |
          set -Eeuo pipefail
          remote="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          ssh -p "${DEPLOY_SSH_PORT}" "${remote}" bash -s -- \
            "${DEPLOY_APP_DIR}" "${DEPLOY_SHA}" dev <<'REMOTE' 2>&1 | tee deploy.log
          set -Eeuo pipefail
          app_dir=$1
          release_sha=$2
          deployment_target=$3
          cd "${app_dir}/.release"
          chmod 700 deploy_docker.sh
          ./deploy_docker.sh "${app_dir}" "${release_sha}" "${deployment_target}"
          REMOTE

      - name: Upload deploy log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arhibot-dev-deploy-${{ env.DEPLOY_SHA }}
          path: deploy.log
          if-no-files-found: ignore
          retention-days: 14

