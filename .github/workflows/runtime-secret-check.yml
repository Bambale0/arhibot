name: Runtime secret check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-secret-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBAPP_URL: ${{ secrets.TELEGRAM_WEBAPP_URL }}
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in TELEGRAM_BOT_TOKEN TELEGRAM_WEBAPP_URL DEPLOY_SSH_HOST DEPLOY_SSH_USER; do
            if [[ -n "${!name:-}" ]]; then
              echo "${name}=SET"
            else
              echo "${name}=MISSING"
            fi
          done
